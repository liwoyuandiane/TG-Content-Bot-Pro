version: "3.8"

services:
  tg-content-bot-pro:
    build: .
    container_name: tg-content-bot-pro
    restart: "no"
    
    # 环境变量配置
    environment:
      API_ID: ${API_ID}
      API_HASH: ${API_HASH}
      BOT_TOKEN: ${BOT_TOKEN}
      AUTH: ${AUTH}
      MONGO_DB: ${MONGO_DB}
      SESSION: ${SESSION:-}
      FORCESUB: ${FORCESUB:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_WORKERS: ${MAX_WORKERS:-3}
      MIN_CONCURRENCY: ${MIN_CONCURRENCY:-1}
      MAX_CONCURRENCY: ${MAX_CONCURRENCY:-15}
      CHUNK_SIZE: ${CHUNK_SIZE:-524288}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      RETRY_DELAY: ${RETRY_DELAY:-1.0}
      CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-30}
      READ_TIMEOUT: ${READ_TIMEOUT:-60}
      HEALTH_CHECK_PORT: ${HEALTH_CHECK_PORT:-28089}
      DEFAULT_DAILY_LIMIT: ${DEFAULT_DAILY_LIMIT:-1073741824}
      DEFAULT_MONTHLY_LIMIT: ${DEFAULT_MONTHLY_LIMIT:-10737418240}
      DEFAULT_PER_FILE_LIMIT: ${DEFAULT_PER_FILE_LIMIT:-104857600}
      FREEMIUM_LIMIT: ${FREEMIUM_LIMIT:-0}
      PREMIUM_LIMIT: ${PREMIUM_LIMIT:-10}
    
    # 端口映射 - 用于健康检查
    ports:
      - "${HEALTH_CHECK_PORT:-28089}:${HEALTH_CHECK_PORT:-28089}"
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 健康检查（Docker层面）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${HEALTH_CHECK_PORT:-28089}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s